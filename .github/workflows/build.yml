name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [linux64, linux32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix build ".#${{ matrix.package }}" --print-build-logs

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gm_mcp-${{ matrix.package }}
          path: result/lib/gmsv_mcp_*.dll
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win64
            arch: x64
          - target: win32
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }}

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: gm_mcp-${{ matrix.target }}
          path: build/${{ matrix.target }}/gmsv_mcp_*.dll
          if-no-files-found: error

  mcp:
    name: Bun MCP package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SHORT_SHA="${GITHUB_SHA::7}"
          bun -e "
            const pkg = await Bun.file('package.json').json();
            const base = String(pkg.version).split('-')[0];
            pkg.version = \`\${base}-\${process.env.SHORT_SHA}\`;
            await Bun.write('package.json', JSON.stringify(pkg, null, '\t') + '\n');
            console.log('publishing', pkg.name, pkg.version);
          "
          {
            echo "@unknown-gd:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc
          bun publish --access public --tag next

  release:
    name: Publish release
    needs: [linux, windows, mcp]
    if: github.event_name != 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download modules
        uses: actions/download-artifact@v4
        with:
          pattern: gm_mcp-*
          path: modules
          merge-multiple: true

      - name: Short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.sha }}
          name: ${{ steps.meta.outputs.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: modules/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
